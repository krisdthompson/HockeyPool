# App names are global on fly.io; change this if "hockeypool-draft" is taken.
app = "hockeypool-draft"
primary_region = "dfw"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"
  # Logins (see auth.go). Hashes, not passwords; make new ones with
  # `go run . hash <password>`. A DRAFT_PASSWORD secret also works for the admin.
  DRAFT_ADMIN_USER = "kris"
  DRAFT_ADMIN_HASH = "pbkdf2$200000$6ee5208d934b7b75531af08521e12af1$90217bfbe364a51eb8062667665a5413ea5d40a9a3cc776a694531e8a27163a1"
  # Guest entry phrases (comma-separated hashes accept more than one).
  DRAFT_GUEST_HASH = "pbkdf2$200000$e9d9ea72faedf018065fabd863105f35$a16d0e37defcfdad1b46051f5739ca8443d49fbb23a7401e9e24039694e24939,pbkdf2$200000$025a81493e9742791d5d50f5ef90b56a$9f748035953a689b3d7a59e1519886e91e621541d420c0003429a429ab813cac"

[mounts]
  source = "draft_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine up all night: state is in memory plus the volume.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
