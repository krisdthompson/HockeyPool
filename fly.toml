# App names are global on fly.io; change this if "hockeypool-draft" is taken.
app = "hockeypool-draft"
primary_region = "dfw"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"

[mounts]
  source = "draft_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine up all night: state is in memory plus the volume.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
