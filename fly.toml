# App names are global on fly.io; change this if "hockeypool-draft" is taken.
app = "hockeypool-draft"
primary_region = "dfw"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"
  # Logins (see auth.go). Hashes, not passwords; make new ones with
  # `go run . hash <password>`. A DRAFT_PASSWORD secret also works for the admin.
  DRAFT_ADMIN_USER = "kris"
  DRAFT_ADMIN_HASH = "pbkdf2$200000$6ee5208d934b7b75531af08521e12af1$90217bfbe364a51eb8062667665a5413ea5d40a9a3cc776a694531e8a27163a1"
  DRAFT_GUEST_HASH = "pbkdf2$200000$01cdbaa58e6677b8e88ee32095b5f3aa$9b48a23e6c2c6cd59b7dc52be4c3b66988f77cac2cfb343bbab957374fa46660"

[mounts]
  source = "draft_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine up all night: state is in memory plus the volume.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
