# Tests on every push and pull request. Deploys to fly.io only when run by
# hand (Actions -> Deploy to fly.io -> Run workflow), so a push can't bring
# a torn-down app back by accident. Needs a FLY_API_TOKEN repo secret
# (`fly tokens create org`). Creates the app and its volume on first run.
name: Deploy to fly.io
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_only:
        description: Only run the read-only live-site check
        type: boolean
        default: false

concurrency: fly-deploy-${{ github.ref }}

jobs:
  test:
    if: ${{ !inputs.live_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Go tests and API Gherkin scenarios
        run: go vet ./... && go test ./...
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json
      - name: Browser Gherkin scenarios (@ui) at 375, 768 and 1280 px
        working-directory: ui-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

  deploy:
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.live_only }}
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Custom domain; its DNS CNAME must point at <app>.fly.dev.
      CUSTOM_HOST: hockeypool.opeongo.net
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create app and volume if missing
        run: |
          app=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)
          region=$(sed -n 's/^primary_region = "\(.*\)"/\1/p' fly.toml)
          flyctl status --app "$app" >/dev/null 2>&1 || flyctl apps create "$app"
          if ! flyctl volumes list --app "$app" | grep -q draft_data; then
            flyctl volumes create draft_data --app "$app" --region "$region" --size 1 --yes
          fi
      - run: flyctl deploy --remote-only --ha=false
      - name: TLS certificate for the custom domain
        run: |
          app=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)
          flyctl certs show "$CUSTOM_HOST" --app "$app" >/dev/null 2>&1 || flyctl certs add "$CUSTOM_HOST" --app "$app"
          flyctl certs show "$CUSTOM_HOST" --app "$app"

  # Read-only smoke test of the live site after each deploy (guest checks run
  # when a GUEST_PHRASE repo secret is set).
  live-check:
    needs: deploy
    if: ${{ always() && (needs.deploy.result == 'success' || inputs.live_only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json
      - name: Check the live site
        working-directory: ui-tests
        env:
          SITE: https://hockeypool.opeongo.net
          GUEST_PHRASE: ${{ secrets.GUEST_PHRASE }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sleep 20  # let the new machine settle
          node live-check.mjs
